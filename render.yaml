services:
  - type: web
    name: english-duo-hub
    env: python
    buildCommand: pip install -r requirements.txt && python database.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
